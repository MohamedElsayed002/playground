services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - node_modules/
            - dist/
            - .git/
            - .next/
  backend-fastapi:
    build: ./playground-fastapi
    ports:
      - "8001:8001"
    env_file:
      - ./playground-fastapi/.env
    environment:
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      otel-collector:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./playground-fastapi
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    environment:
      INTERNAL_API_URL: http://backend:3001
      INTERNAL_FASTAPI_API_URL: http://backend-fastapi:8001
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./client
          ignore:
            - node_modules/
            - .next/
            - .git/

  otel-collector:
    image: otel/opentelemetry-collector-contrib:nightly-amd64
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
    depends_on:
      tempo:
        condition: service_started
  tempo:
    image: grafana/tempo:3.0.3
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"
  grafana:
    image:  grafana/grafana:13.2.2
    container_name: grafana
    ports:
      - "3005:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      tempo:
        condition: service_started
  langgraph:
    build: ./LangGraph
    ports:
      - "8000:8000"

